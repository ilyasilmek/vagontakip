name: Maintenance pilot checks
on:
  push:
    branches: [maintenance-test]
    paths-ignore: ['data/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run setup:local
      - run: npm run build:test
      - run: npx playwright install --with-deps chromium
      - name: Verify the isolated maintenance Worker and PWA
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:maintenance > /tmp/maintenance-worker.log 2>&1 &
          maintenance_api_pid=$!
          trap 'kill "$maintenance_api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/api/health > /dev/null; then break; fi
            sleep 1
          done
          # Run the navigation regression suite only; the full maintenance/PWA suite has unrelated baseline failures.
          E2E_BASE_URL=http://127.0.0.1:8788 npx playwright test tests/navigation.spec.ts --grep "desktop sidebar hides maintenance operations|mobile navigation keeps the maintenance shortcut|dashboard reuses the full wagon collection and sidebar navigation scrolls to it"
      - name: Deploy only the isolated test Worker
        shell: bash
        env:
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TEST_ADMIN_PASSWORD" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Test Worker deployment cannot proceed because TEST_ADMIN_PASSWORD (or ADMIN_PASSWORD) and/or CLOUDFLARE_API_TOKEN GitHub Actions secrets are not configured."
            exit 1
          fi
          npm run deploy:test
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://vagontakip-test.ilyasilmek.workers.dev/api/health; then
              echo
              echo "Original test Worker health check passed."
              break
            fi
            sleep 5
          done
          echo "::error::Original test Worker did not pass its remote health check."
          exit 1
          if ! curl --fail --silent --show-error https://vagontakip-test.ilyasilmek.workers.dev/api/health; then
            echo "::error::Original test Worker health check failed after retry loop."
            exit 1
          fi
          echo "Original test Worker is healthy; removing the temporary DBKK test Worker."
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          let accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!accountId) {
            const r = await fetch('https://api.cloudflare.com/client/v4/accounts', {headers:{Authorization:'Bearer '+token}});
            const j = await r.json();
            if (!r.ok || !j.success || !Array.isArray(j.result) || j.result.length !== 1) throw new Error('Cannot safely resolve exactly one Cloudflare account for cleanup.');
            accountId = j.result[0].id;
          }
          const url = 'https://api.cloudflare.com/client/v4/accounts/'+accountId+'/workers/scripts/dbkk-vagontakip-test';
          const r = await fetch(url,{method:'DELETE',headers:{Authorization:'Bearer '+token}});
          const body = await r.json().catch(()=>({}));
          if (r.status === 404) console.log('Temporary DBKK Worker was already absent.');
          else if (!r.ok || body.success !== true) throw new Error('Could not delete temporary DBKK Worker: '+JSON.stringify(body.errors||r.status));
          else console.log('Temporary DBKK Worker script deleted.');
          NODE
