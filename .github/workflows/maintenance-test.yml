name: Maintenance pilot checks
on:
  push:
    branches: [maintenance-test]
    paths-ignore: ['data/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run setup:local
      - run: npm run build:test
      - run: npx playwright install --with-deps chromium
      - name: Verify the isolated maintenance Worker and PWA
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:maintenance > /tmp/maintenance-worker.log 2>&1 &
          maintenance_api_pid=$!
          trap 'kill "$maintenance_api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/api/health > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:8788 E2E_MAINTENANCE=true npm run test:e2e
      - name: Deploy only the isolated test Worker
        shell: bash
        env:
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TEST_ADMIN_PASSWORD" || -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::Test Worker deployment skipped because TEST_ADMIN_PASSWORD, CLOUDFLARE_API_TOKEN, and/or CLOUDFLARE_ACCOUNT_ID GitHub Actions secrets are not configured."
            exit 0
          fi
          npm run deploy:test
