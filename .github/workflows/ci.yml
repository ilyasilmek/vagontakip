name: Application checks
on:
  push:
    branches: [main]
    paths-ignore: ['data/database.enc.json']
  pull_request:
    paths-ignore: ['data/database.enc.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the local Worker and mobile PWA
        shell: bash
        run: |
          set -euo pipefail
          npm run setup:local
          npm run dev:api > /tmp/vagon-worker.log 2>&1 &
          vagon_api_pid=$!
          trap 'kill "$vagon_api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:e2e
